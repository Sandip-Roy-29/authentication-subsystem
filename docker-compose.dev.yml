services:
  app:
    image: crosslink:dev

    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: crosslink-dev

    ports:
      - "8000:8000"

    env_file:
      - .env.development

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  redis:
    image: redis:8.0-alpine

    container_name: crosslink-redis-dev

    tmpfs:
      - /data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
