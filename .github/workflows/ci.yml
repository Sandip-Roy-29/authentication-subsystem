name: CI

on:
    push:
    pull_request:

jobs:
    test:
        name: Lint & Test
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:8
                ports:
                    - 6379:6379

                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            NODE_ENV: test

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create .env.test
              run: |
                cat <<EOF > .env.test
                NODE_ENV=test
                PORT=5000

                MONGODB_URI=${{ secrets.MONGODB_URI }}

                DB_MIN_POOL_SIZE=2
                DB_MAX_POOL_SIZE=5

                BCRYPT_SALT_ROUNDS=1

                ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
                ACCESS_TOKEN_EXPIRY=15m

                REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
                REFRESH_TOKEN_EXPIRY=7d

                REDIS_URL=redis://localhost:6379

                LOGIN_RATE_LIMIT_WINDOW_MS=1000
                LOGIN_RATE_LIMIT_MAX=2

                REGISTER_RATE_LIMIT_WINDOW_MS=1000
                REGISTER_RATE_LIMIT_MAX=2

                REFRESH_RATE_LIMIT_WINDOW_MS=1000
                REFRESH_RATE_LIMIT_MAX=2

                ADMIN_RATE_LIMIT_WINDOW_MS=3600000
                ADMIN_RATE_LIMIT_MAX=100

                VERIFICATION_RATE_LIMIT_WINDOW_MS=600000
                VERIFICATION_RATE_LIMIT_MAX=10

                RESEND_VERIFICATION_RATE_LIMIT_WINDOW_MS=3600000
                RESEND_VERIFICATION_RATE_LIMIT_MAX=5

                FORGOT_PASSWORD_RATE_LIMIT_WINDOW_MS=3600000
                FORGOT_PASSWORD_RATE_LIMIT_MAX=5

                RESET_PASSWORD_RATE_LIMIT_WINDOW_MS=600000
                RESET_PASSWORD_RATE_LIMIT_MAX=10

                GOOGLE_RATE_LIMIT_WINDOW_MS=3600000
                GOOGLE_RATE_LIMIT_MAX=10

                SMTP_HOST=smtp.gmail.com
                SMTP_PORT=587
                SMTP_EMAIL=test@gmail.com
                SMTP_PASSWORD=dummy-password

                GOOGLE_CLIENT_ID=test-client-id
                GOOGLE_CLIENT_SECRET=test-client-secret
                GOOGLE_CALLBACK_URL=http://localhost:5000/api/v1/auth/google/callback

                FRONTEND_URL=http://localhost:5173
                EOF
            
            - name: Verify .env.test
              run: |
                lif [ -f .env.test ]; then
                echo ".env.test created successfully"
                else
                echo ".env.test not found"
                exit 1
                fi

            - name: Check MongoDB URI
              run: |
                if [ -z "$MONGODB_URI" ]; then
                echo "MONGODB_URI secret is missing"
                exit 1
                fi
                env:
                  MONGODB_URI: ${{ secrets.MONGODB_URI }}

            - name: Run ESLint
              run: npm run lint

            - name: Run Tests
              run: npm test
