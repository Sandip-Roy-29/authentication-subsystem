name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup

      - name: Run ESLint
        run: npm run lint

  test:
    name: Application Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-setup

      - uses: ./.github/actions/prepare-test-env
        with:
          access-token-secret: ${{ secrets.ACCESS_TOKEN_SECRET }}
          refresh-token-secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Run Tests
        run: npm test -- --runInBand --coverage

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/node-setup

      - uses: ./.github/actions/dependency-audit

  container-validation:
    name: Container Validation
    runs-on: ubuntu-latest

    needs:
      - lint
      - test
      - dependency-audit

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-smoke-test
        with:
          image-name: authentication-subsystem
          image-tag: ${{ github.sha }}
          env-file: .env.smoke-test.example

      - uses: ./.github/actions/docker-security-scan
        with:
          image-name: authentication-subsystem
          image-tag: ${{ github.sha }}